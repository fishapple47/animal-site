<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>どうぶつタイプ診断 🐾</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  background:linear-gradient(135deg,#fce3ff,#e0f7ff,#fff0f6);
  background-size:200% 200%;
  animation:bgMove 10s ease infinite;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  margin:0;
  padding:20px;
}
@keyframes bgMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
.card{
  background:white;
  padding:25px;
  border-radius:25px;
  box-shadow:0 20px 50px rgba(0,0,0,0.1);
  width:100%;
  max-width:900px;
  text-align:center;
}
.results{
  display:flex;
  gap:20px;
  justify-content:center;
  flex-wrap:wrap;
}
.resultCard{
  flex:1;
  min-width:250px;
  background:#fff;
  border-radius:20px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
}
.animalImg{
  font-size:50px;
}
button{
  background:#ff7ecb;
  border:none;
  padding:10px 20px;
  border-radius:30px;
  color:white;
  cursor:pointer;
  margin-top:10px;
}
#compatibility{
  font-size:22px;
  margin-top:20px;
  font-weight:bold;
}
.tiny-terms{
  font-size:6px;
  color:#ccc;
}
</style>
</head>
<body>

<div class="card">
<h2>どうぶつタイプ診断 🐶</h2>
<p>顔写真を選んで「診断する」を押してね✨</p>

<input type="file" id="imageInput" accept="image/*">
<button onclick="diagnose()">診断する</button>
<button onclick="addFriend()">もう1人診断する</button>

<div id="loading"></div>

<div class="results" id="results"></div>
<div id="compatibility"></div>

<button onclick="saveScreenshot()">結果を保存📸</button>
<button onclick="shareResult()">シェア📤</button>

<br><a href="terms.html" target="_blank" class="tiny-terms">利用規約はこちら</a>
</div>

<script>
const animals=[
{name:"ライオン 🦁",rare:"★★★★★",emoji:"🦁"},
{name:"ねこ 🐱",rare:"★★★",emoji:"🐱"},
{name:"いぬ 🐶",rare:"★★★",emoji:"🐶"},
{name:"パンダ 🐼",rare:"★★★★",emoji:"🐼"},
{name:"うさぎ 🐰",rare:"★★",emoji:"🐰"},
{name:"きつね 🦊",rare:"★★★★",emoji:"🦊"},
{name:"ハリネズミ 🦔",rare:"★★",emoji:"🦔"},
{name:"コアラ 🐨",rare:"★★★",emoji:"🐨"}
];

let results=[];

function hashCode(str){
  let hash=0;
  for(let i=0;i<str.length;i++){
    hash=str.charCodeAt(i)+((hash<<5)-hash);
  }
  return Math.abs(hash);
}

function diagnose(){
  const file=document.getElementById("imageInput").files[0];
  if(!file){alert("画像を選んでね");return;}

  document.getElementById("loading").innerText="診断中…🐾";

  let key=file.name+file.size;
  let index=hashCode(key)%animals.length;
  let animal=animals[index];

  setTimeout(()=>{
    document.getElementById("loading").innerText="";
    addResult(animal);
  },1500);
}

function addResult(animal){
  results.push(animal);
  const container=document.getElementById("results");

  const div=document.createElement("div");
  div.className="resultCard";
  div.innerHTML=`
    <div class="animalImg">${animal.emoji}</div>
    <h3>${animal.name}</h3>
    <p>レア度：${animal.rare}</p>
  `;
  container.appendChild(div);

  if(results.length===2){
    showCompatibility();
  }
}

function addFriend(){
  document.getElementById("imageInput").value="";
}

function showCompatibility(){
  let percent=Math.floor(Math.random()*41)+60;
  document.getElementById("compatibility").innerText=
  "2人の相性は… "+percent+"％ 💕";
}

function saveScreenshot(){
  html2canvas(document.querySelector(".card")).then(canvas=>{
    const link=document.createElement("a");
    link.download="result.png";
    link.href=canvas.toDataURL();
    link.click();
  });
}

function shareResult(){
  if(navigator.share){
    navigator.share({
      title:"どうぶつタイプ診断",
      text:"診断してみたよ！",
      url:location.href
    });
  }else{
    alert("この端末ではシェア非対応です");
  }
}
</script>

</body>
</html>
