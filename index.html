<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>どうぶつタイプ診断 🐾</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  background:linear-gradient(135deg,#ffe6f0,#e6f7ff);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  margin:0;
  padding:20px;
}
.card {
  background:white;
  padding:30px 25px;
  border-radius:25px;
  box-shadow:0 15px 40px rgba(0,0,0,0.1);
  text-align:center;
  width:100%;
  max-width:380px;
}
button {
  background:#ff80bf;
  border:none;
  padding:12px;
  border-radius:50px;
  color:white;
  font-size:16px;
  cursor:pointer;
  width:100%;
}
#preview {
  width:100px;
  height:100px;
  border-radius:50%;
  object-fit:cover;
  margin:10px auto;
  display:none;
}
.resultCard {
  margin-top:20px;
  padding:20px;
  border-radius:20px;
  background:#fff0f8;
}
</style>
</head>
<body>

<div class="card">
<h1>あなたはどのどうぶつ？ 🐶</h1>
<p>顔写真を選んで「診断する」を押してね！✨</p>

<img id="preview">

<form id="animalForm">
<input type="file" id="imageInput" accept="image/*" required>
<button type="submit">診断する ✨</button>
</form>

<div id="result"></div>
</div>

<script>

// ✅ あなたのSupabase情報（過去のものを挿入済み）
const supabase = window.supabase.createClient(
  "https://kuxeqdsvpzdtssejkasy.supabase.co",
  "sb_publishable_mySITy6a-TF4f5XWllztsQ_eXyaWHrM"
);

const animals = [
{name:"ライオン 🦁", rare:"★★★★★ 超レア！"},
{name:"ねこ 🐱", rare:"★★★ ふつう"},
{name:"いぬ 🐶", rare:"★★★ 人気タイプ"},
{name:"パンダ 🐼", rare:"★★★★ レア"},
{name:"うさぎ 🐰", rare:"★★ ちょいレア"},
{name:"きつね 🦊", rare:"★★★★ レア"},
{name:"ハリネズミ 🦔", rare:"★★ ちょいレア"},
{name:"コアラ 🐨", rare:"★★★ 癒し枠"}
];

const preview = document.getElementById("preview");
const imageInput = document.getElementById("imageInput");

imageInput.addEventListener("change", function() {
  const file = this.files[0];
  if (file) {
    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
  }
});

// 🔥 画像ハッシュ生成（同じ画像＝同じ結果）
async function getImageHash(file){
  const buffer = await file.arrayBuffer();
  const hashBuffer = await crypto.subtle.digest("SHA-256", buffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.reduce((sum, byte) => sum + byte, 0);
}

document.getElementById("animalForm").addEventListener("submit", async function(e){
e.preventDefault();

const file = imageInput.files[0];
if(!file){ alert("画像を選んでね"); return; }

// 🔥 ハッシュ取得
const hashValue = await getImageHash(file);
const index = hashValue % animals.length;
const selectedAnimal = animals[index];

// 🔥 同じ画像は同じファイル名
const fileName = hashValue + "_" + file.name;

// 🔥 Storageへ保存
const { error: uploadError } = await supabase
  .storage
  .from("images")
  .upload(fileName, file, { upsert: true });

if(uploadError){
  alert("アップロード失敗：" + uploadError.message);
  return;
}

// 🔥 結果表示
document.getElementById("result").innerHTML=`
<div class="resultCard">
<h3>${selectedAnimal.name}</h3>
<p>レア度：${selectedAnimal.rare}</p>
</div>
`;

});
</script>

</body>
</html>
