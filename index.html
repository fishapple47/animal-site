<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>動物タイプ診断</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <h1>あなたはどの動物タイプ？</h1>

  <form id="animalForm">
    <p>
      <input type="file" id="imageInput" accept="image/*" required>
    </p>

    <p>
      <a href="terms.html" target="_blank">利用規約はこちら</a>
    </p>

    <p>
      <label>
        <input type="checkbox" required>
        利用規約に同意
      </label>
    </p>

    <p>
      <button type="submit">診断する</button>
    </p>
  </form>

  <h2 id="result"></h2>

  <script>
    // Supabase初期化（1回だけ！）
    const client = window.supabase.createClient(
      "https://kuxeqdsvpzdtssejkasy.supabase.co",
      "sb_publishable_mySITy6a-TF4f5XWllztsQ_eXyaWHrM"
    );

    const animals = [
      "ライオン 🦁",
      "ねこ 🐱",
      "いぬ 🐶",
      "パンダ 🐼",
      "うさぎ 🐰",
      "きつね 🦊",
      "ハリネズミ 🦔",
      "コアラ 🐨"
    ];

    document.getElementById("animalForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const file = document.getElementById("imageInput").files[0];
      if (!file) {
        alert("画像を選んでください");
        return;
      }

      const fileName = Date.now() + "_" + file.name;

      // ① Storageにアップロード
      const { error: uploadError } = await client
        .storage
        .from("images")
        .upload(fileName, file);

      if (uploadError) {
        console.log(uploadError);
        alert("アップロード失敗");
        return;
      }

      // ② 公開URL取得
      const { data } = client
        .storage
        .from("images")
        .getPublicUrl(fileName);

      const imageUrl = data.publicUrl;

      // ③ DB保存
      const { error: insertError } = await client
        .from("uploads")
        .insert([{ image_url: imageUrl }]);

      if (insertError) {
        console.log(insertError);
        alert("DB保存失敗");
        return;
      }

      // ④ ランダム動物表示
      const randomIndex = Math.floor(Math.random() * animals.length);
      const selectedAnimal = animals[randomIndex];

      document.getElementById("result").textContent =
        "あなたは… " + selectedAnimal + " タイプです！";
    });
  </script>

</body>
</html>
