<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カメラロール診断 🐾</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  background:linear-gradient(135deg,#ffe6f0,#e6f7ff);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  margin:0;
  padding:20px;
}
.card {
  background:white;
  padding:30px 25px;
  border-radius:25px;
  box-shadow:0 15px 40px rgba(0,0,0,0.1);
  text-align:center;
  width:100%;
  max-width:380px;
}
button{
  background:#ff80bf;
  border:none;
  padding:12px;
  border-radius:50px;
  color:white;
  font-size:16px;
  width:100%;
}
.back{
  display:block;
  margin-top:15px;
  font-size:12px;
  color:#999;
  text-decoration:none;
}
</style>
</head>
<body>

<div class="card">
<h1>カメラロールから選択 🐰</h1>
<p>保存済みの写真を使えます✨</p>

<form>
<input type="file" accept="image/*" required>
<button type="submit">診断する</button>
</form>

<a href="index.html" class="back">
  ← インカメラに戻る
</a>

</div>
</body>
</html>
